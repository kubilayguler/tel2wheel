# Push a tag like v1.0.0 and this builds the PC server and the APK and attaches both to a
# GitHub release. Run it by hand (Actions > Release > Run workflow) to get the files as build
# artifacts without publishing a release.
#
# Optional, for a stable APK signature so users can update without reinstalling, add these
# repository secrets: KEYSTORE_BASE64 (base64 of a .jks file), KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD. Without them the APK is signed with a throwaway debug key.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained exe
        run: |
          dotnet publish pc/Tel2Wheel.Server -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out
          Move-Item out/Tel2Wheel.Server.exe Tel2Wheel-Server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: Tel2Wheel-Server.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "T2W_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          T2W_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          T2W_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          T2W_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          T2W_VERSION_CODE: ${{ github.run_number }}
          T2W_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Tel2Wheel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Tel2Wheel.apk

  release:
    needs: [pc, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tel2Wheel-Server.exe
            dist/Tel2Wheel.apk
